<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%TITLE%%</title>
<style>
:root{--ground:#E7E1CF;--ink:#23211E;--muted:#5D574E;--paper:%%PAPER%%;--wax:#8E2A22;--wax-hi:#B5463A;--ease:cubic-bezier(.2,.9,.25,1)}
.night{--ground:#151A22;--ink:#E9E4DA;--muted:#A49D90}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:rgba(160,106,28,.3)}
main{position:relative;min-height:100vh;min-height:100svh;height:var(--page-h,auto);overflow:hidden}
.piece{position:absolute;left:var(--ex);top:var(--ey);width:var(--ew);height:var(--eh);transform:translateY(var(--env-y,0));transition:transform .7s var(--ease),opacity .5s}
.piece svg{display:block;width:100%;height:100%;overflow:visible}
.gone .piece{--env-y:46vh;opacity:0}
.shadow{z-index:0;border-radius:4px;box-shadow:0 18px 40px -14px rgba(40,30,15,.38),0 3px 8px rgba(40,30,15,.16)}
.night .shadow{box-shadow:0 18px 40px -14px rgba(0,0,0,.7),0 3px 8px rgba(0,0,0,.45)}
.inside{z-index:1}
.pocket{z-index:3;pointer-events:none}
.flap{z-index:5;cursor:grab;touch-action:none;transform-origin:50% 0;transform:translateY(var(--env-y,0)) perspective(1600px) rotateX(var(--flap,0deg))}
.flap:active{cursor:grabbing}
.flap.torn{transition:transform .55s var(--ease)}
.flap.open{--flap:-176deg;z-index:1}
.flap-low{z-index:4;pointer-events:none}
.flap .in{opacity:0}
.flap.open .in{opacity:1;transition:opacity 0s .1s}
.flap.open .out{opacity:0;transition:opacity 0s .1s}
.p3 .back{clip-path:var(--torn-back)}
.flap:focus-visible{outline:2px solid #A06A1C;outline-offset:6px}
.hint{position:absolute;left:0;right:0;top:calc(var(--ey) + var(--eh) + 28px);margin:0;text-align:center;color:var(--muted);font-size:15px;transition:opacity .3s}
.hint.hide{opacity:0}
.letter{position:absolute;z-index:2;left:var(--lx);top:var(--ly);width:var(--lw);height:var(--lh);perspective:calc(var(--lh) * 2.05);transform-style:preserve-3d;
  transform:translate(var(--tx,0),var(--ty,0)) scale(var(--ts,1));transition:transform .8s var(--ease)}
.letter.rise{transition-duration:.6s}
.letter.read{z-index:6}
.panel{position:absolute;left:0;width:100%;height:33.334%;transform-style:preserve-3d;transition:transform .62s var(--ease)}
.p1{top:0;transform-origin:50% 100%;transform:translateZ(var(--z1,0px)) rotateX(var(--a1,3deg))}
.p2{top:33.333%}
.p3{top:66.666%;transform-origin:50% 0;transform:translateZ(var(--z3,0px)) rotateX(var(--a3,-3deg))}
/* the bottom third folds in first and lies flat, the top third over it a hair above: the two never cut through each other */
.folded{--a1:-178deg;--a3:180deg;--z1:1.6px;--z3:.8px}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{background:var(--paper) no-repeat;background-size:100% 100%}
.p1 .front{background-image:url("%%IMG1%%")}
.p2 .front{background-image:url("%%IMG2%%")}
.p3 .front{background-image:url("%%IMG3%%");clip-path:var(--torn)}
.back{transform:rotateX(180deg);background:var(--paper) url("%%BACK%%") no-repeat;background-size:100% 300%}
.p1 .back{background-position:0 0}
.p2 .back{background-position:0 50%}
.p3 .back{background-position:0 100%}
.back::after,.front::after{content:"";position:absolute;inset:0;pointer-events:none}
/* the creases: a soft valley of shade and a lift of light either side of each fold, never a hard line */
.p1 .front::after{background:linear-gradient(to top,rgba(60,45,25,.10),rgba(60,45,25,0) 6%)}
.p2 .front::after{background:linear-gradient(to bottom,rgba(255,255,255,.28),rgba(255,255,255,0) 5%,rgba(255,255,255,0) 94%,rgba(60,45,25,.08))}
.p3 .front::after{background:linear-gradient(to bottom,rgba(255,255,255,.3),rgba(255,255,255,0) 6%)}
.back::after{background:linear-gradient(to bottom,rgba(60,45,25,.06),rgba(60,45,25,0) 40%)}
.letter.read .front{box-shadow:0 10px 22px -8px rgba(40,30,15,.22)}
.night .letter.read .front{box-shadow:0 10px 24px -8px rgba(0,0,0,.6)}
.sig{position:absolute;left:0;right:0;top:calc(var(--ly) + var(--lh) + 28px);margin:0;text-align:center;color:var(--muted);font-size:13px;opacity:0;transition:opacity .6s .3s}
.read-done .sig{opacity:1}
.crease{position:absolute;left:0;bottom:0;width:100%;height:3.2%;overflow:visible;pointer-events:none}
.crease.top{top:0;bottom:auto}
.foot{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:pre-wrap}
.instant *{transition:none!important}
@media (prefers-reduced-motion:reduce){.piece,.letter,.panel,.flap.torn,.hint,.sig{transition-duration:.01ms!important}}
</style>
<noscript><style>main{display:none}.sr{position:static;width:auto;height:auto;overflow:visible;clip-path:none;max-width:40em;margin:40px auto;padding:0 16px;font:16px/1.6 ui-monospace,monospace}</style></noscript>
</head>

<script>
(function () {
  var ANIMATE = %%ANIMATE%%, IMG_W = %%IMGW%%, IMG_H = %%IMGH%%, SOUNDS = %%SOUNDS%%;
  var calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var root = document.documentElement, main = $("main"), letter = $("letter"), flap = $("flap"), hint = $("hint");
  function $(id) { return document.getElementById(id); }
  function set(id, d) { $(id).setAttribute("d", d); }
  function play(n, v) { try { var a = new Audio(SOUNDS[n]); a.volume = v || 0.8; a.play().catch(function () {}); } catch (e) {} }
  function pts(list) { return list.map(function (q) { return q[0].toFixed(1) + " " + q[1].toFixed(1); }).join("L"); }
  function rev(list) { return list.slice().reverse(); }
  // A line moved sideways along its normals: positive is to the left of its direction of travel.
  function shift(list, k) {
    return list.map(function (q, i) {
      var a = list[Math.max(0, i - 1)], b = list[Math.min(list.length - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
      return [q[0] + dy / l * k, q[1] - dx / l * k];
    });
  }
  // A seeded wobble, so the same letter tears the same way every time it is opened.
  var seed = 7; function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }

  // The torn foot of the sheet, where it was ripped from the machine: ragged on both faces, with a band of loose fibre.
  var footY = [], n;
  var fph = rnd() * 6.28;
  for (n = 0; n <= 120; n++) footY.push(100 - 0.5 - 0.5 * (1 + Math.sin(n * 0.37 + fph)) * 0.6 - rnd() * 1.1);
  root.style.setProperty("--torn", "polygon(0 0,100% 0," + footY.map(function (y, i) { return (i / 1.2).toFixed(2) + "% " + y.toFixed(2) + "%"; }).reverse().join(",") + ")");
  root.style.setProperty("--torn-back", "polygon(" + footY.map(function (y, i) { return (i / 1.2).toFixed(2) + "% " + (100 - y).toFixed(2) + "%"; }).join(",") + ",100% 100%,0 100%)");
  var edge = footY.map(function (y, i) { return [i * 1000 / 120, y]; });

  }

  function layout() {
