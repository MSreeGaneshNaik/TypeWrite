<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>TypeWrite by Jericho</title>
<meta name="description" content="A typewriter in your browser. Every key clacks, the bell rings near the margin, the ink sits in old paper, and a sheet can go out as a sealed letter.">
<meta name="theme-color" content="#161514"><meta property="og:title" content="TypeWrite by Jericho">
<meta property="og:description" content="A typewriter in your browser and on your iPhone. Every key clacks."><meta property="og:image" content="Branding/JerichoTile.png">
<link rel="icon" type="image/png" href="Branding/JerichoTile.png"><link rel="apple-touch-icon" href="Branding/AppIcon-1024.png"><script src="web/assets/three-r149.min.js"></script>
<style>
@font-face{font-family:"Courier Prime";src:url("TypeWrite/Resources/Fonts/CourierPrime-Regular.ttf") format("truetype");font-display:block}
@font-face{font-family:"Special Elite";src:url("TypeWrite/Resources/Fonts/SpecialElite-Regular.ttf") format("truetype");font-display:block}
@font-face{font-family:"Cutive Mono";src:url("TypeWrite/Resources/Fonts/CutiveMono-Regular.ttf") format("truetype");font-display:block}
@font-face{font-family:"Lekton";src:url("TypeWrite/Resources/Fonts/Lekton-Regular.ttf") format("truetype");font-display:block}
body{margin:0;background:#E7E1CF}
.tw{--desk:#E7E1CF;--surface:#F2F1EE;--raised:#E6E4DF;--rule:#DAD7D0;--control:#C9C5BC;--text:#23211E;--muted:#55504A;--faint:#6A645B;--primary:#23211E;--primary-hover:#3A3733;--on-primary:#F2F1EE;--on-primary-muted:#C9C5BC;--hud:#3A3733;--gold:#A06A1C;--alarm:#B23A2C;--ui:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--ease-out:cubic-bezier(.2,.9,.25,1);
position:relative;width:100%;height:100vh;min-height:420px;overflow:hidden;background:var(--desk);color:var(--hud);font:14px/20px var(--ui);-webkit-font-smoothing:antialiased;container-type:size;outline:none;user-select:none;-webkit-user-select:none;transition:background-color .6s}
.tw[data-lamp="true"]{--desk:#151A22;--hud:#D6D2C9}
.tw *{box-sizing:border-box}
.tw button,.tw input{font:inherit;color:inherit}
.tw button{-webkit-tap-highlight-color:transparent}
.tw :focus{outline:none}
.tw :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tw-i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tw-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
/* The machine fills the frame */
.tw-stage{position:absolute;inset:0;touch-action:none;cursor:text;-webkit-touch-callout:none}
.tw-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tw-keys{position:absolute;left:50%;top:50%;width:1px;height:1px;opacity:0;border:0;padding:0;margin:0;resize:none;font-size:16px;caret-color:transparent;color:transparent;background:transparent;z-index:1;pointer-events:none}
.tw-clip{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none}
/* The first-line prompt, set on the page itself */
.tw-ghost{position:absolute;inset:0;pointer-events:none;z-index:2}
.tw-ghost[data-on="false"]{display:none}
.tw-ghost p{position:absolute;margin:0;white-space:nowrap;pointer-events:auto;cursor:text;transition:opacity .3s}
.tw-ghost-ask{font-family:var(--mono);color:#5F5B53;transform:translate(-50%,-100%);letter-spacing:.01em}
.tw-ghost-ask[data-on="false"]{display:none}
.tw-ghost-start{color:#67635B;line-height:1;transform:translateY(-82%)}
.tw-ghost-start[data-fade="true"]{opacity:.55}
.tw[data-lamp="true"] .tw-ghost-ask{color:#8F887C}
/* Over the page: your sheets, the count, download */
.tw-hud{position:absolute;inset:0 0 auto 0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;height:60px;padding:0 10px;pointer-events:none;color:var(--hud);transition:color .35s}
.tw-hud>*{pointer-events:auto}
.tw-hud-right{display:flex;align-items:center;gap:2px}
.tw-hud-btn{width:44px;height:44px;border:0;padding:0;border-radius:999px;background:transparent;display:grid;place-items:center;cursor:pointer;transition:background-color .15s,transform .14s var(--ease-out)}
.tw-hud-btn:hover,.tw-hud-btn[aria-expanded="true"]{background:rgba(35,33,30,.07)}
.tw[data-lamp="true"] .tw-hud-btn:hover,.tw[data-lamp="true"] .tw-hud-btn[aria-expanded="true"]{background:rgba(255,255,255,.09)}
.tw-hud-btn:active{transform:scale(.9)}
.tw-count{font:12px/16px var(--mono);letter-spacing:.02em;font-variant-numeric:tabular-nums;padding:0 8px;white-space:nowrap}
.tw-done{height:32px;padding:0 14px;border:1px solid currentColor;border-radius:999px;background:transparent;font-size:13px;font-weight:600;cursor:pointer;margin-right:4px}
/* The dock: one light pill, away while typing */
.tw-dock,.tw-edit{position:absolute;left:50%;bottom:18px;z-index:5;display:flex;align-items:center;gap:2px;padding:6px;border-radius:999px;background:var(--surface);border:1px solid rgba(35,33,30,.08);box-shadow:0 6px 18px rgba(0,0,0,.14),0 1px 2px rgba(0,0,0,.08);transform:translateX(-50%);transition:transform .42s var(--ease-out),opacity .3s,visibility 0s}
.tw-edit{z-index:6;transform:translate(-50%,14px);opacity:0;visibility:hidden;transition:transform .3s var(--ease-out),opacity .2s,visibility 0s .3s}
.tw[data-selecting="true"] .tw-edit{transform:translateX(-50%);opacity:1;visibility:visible;transition:transform .42s var(--ease-out),opacity .2s,visibility 0s}
.tw[data-selecting="true"] .tw-dock{opacity:0;visibility:hidden}
.tw[data-typing="true"] .tw-dock{transform:translate(-50%,calc(100% + 40px));opacity:0;visibility:hidden;transition:transform .28s cubic-bezier(.4,0,.7,.2),opacity .2s,visibility 0s .28s}
.tw-dock-btn{width:44px;height:44px;border:0;padding:0;border-radius:999px;background:transparent;color:var(--text);display:grid;place-items:center;cursor:pointer;transition:background-color .15s,color .15s,transform .14s var(--ease-out)}
.tw-dock-btn:hover,.tw-dock-btn[aria-expanded="true"]{background:var(--raised)}
.tw-dock-btn:active{transform:scale(.9)}
.tw-lamp-btn[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.tw-lamp-btn[aria-pressed="true"]:hover{background:var(--primary-hover)}
.tw-sound-btn .tw-off,.tw-sound-btn[aria-pressed="false"] .tw-on{display:none}
.tw-sound-btn[aria-pressed="false"] .tw-off{display:block}
.tw-rule{width:1px;height:24px;background:var(--rule);margin:0 6px;flex:none}
.tw-edit-btn{height:44px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--text);font:500 14px/20px var(--ui);white-space:nowrap;cursor:pointer;transition:background-color .15s}
.tw-edit-btn:hover:not(:disabled){background:var(--raised)}
.tw-edit-btn:disabled{color:var(--faint);opacity:.55;cursor:default}
/* Panels: popovers on a computer, sheets on a phone */
.tw-scrim{position:absolute;inset:0;z-index:9;background:#000;opacity:0;pointer-events:none;transition:opacity .3s}
.tw:not([data-panel="none"]) .tw-scrim{pointer-events:auto}
.tw-panel{position:absolute;z-index:10;display:flex;flex-direction:column;width:340px;max-height:calc(100% - 140px);background:var(--surface);color:var(--text);border:1px solid rgba(35,33,30,.08);border-radius:18px;box-shadow:0 18px 44px rgba(0,0,0,.28),0 2px 8px rgba(0,0,0,.12);animation:tw-pop .32s var(--ease-out)}
.tw-panel.tw-wide{width:400px}
.tw-panel[data-at="top-left"]{left:10px;top:60px;transform-origin:22px 0}
.tw-panel[data-at="top-right"]{right:10px;top:60px;transform-origin:calc(100% - 22px) 0}
.tw-panel[data-at="dock"]{left:50%;bottom:88px;max-height:calc(100% - 160px);margin-left:-170px;transform-origin:50% 100%;animation-name:tw-pop-up}
@keyframes tw-pop{from{opacity:0;transform:translateY(-8px) scale(.96)}}
@keyframes tw-pop-up{from{opacity:0;transform:translateY(8px) scale(.96)}}
.tw-grabber{display:none}
.tw-panel header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 10px 6px 20px;flex:none}
.tw-panel h2{margin:0;font-size:15px;line-height:20px;font-weight:600}
.tw-masthead{display:flex;align-items:center;gap:10px;min-width:0}
.tw-masthead svg{width:30px;height:30px;border-radius:8px;flex:none}
.tw-masthead h2{display:flex;align-items:baseline;gap:8px}
.tw-wordmark{font-family:"Special Elite",var(--ui);font-size:21px;line-height:24px;font-weight:400}
.tw-by{font-size:12px;line-height:16px;font-weight:500;color:var(--faint)}
.tw-text-btn{border:0;background:none;color:var(--text);font-size:14px;font-weight:600;padding:8px 12px;border-radius:999px;cursor:pointer;transition:background-color .15s}
.tw-text-btn:hover{background:var(--raised)}
.tw-body{overflow:auto;overscroll-behavior:contain;padding:6px 20px 20px;scrollbar-width:thin;scrollbar-color:var(--control) transparent}
.tw-note{margin:14px 0 0;font-size:13px;line-height:18px;color:var(--faint)}
.tw-group{margin-top:18px}
.tw-label{margin:0 0 8px;font-size:13px;line-height:18px;font-weight:600;color:var(--muted)}
.tw-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:4px}
.tw-chip{border:0;background:none;padding:8px 2px 6px;border-radius:10px;display:grid;justify-items:center;gap:8px;color:var(--muted);font-size:12px;line-height:16px;text-align:center;cursor:pointer;transition:color .15s,background-color .15s}
.tw-chip:hover{color:var(--text);background:var(--raised)}
.tw-dot{width:40px;height:40px;border-radius:50%;display:block;box-shadow:0 0 0 1px rgba(35,33,30,.14)}
.tw-chip[aria-checked="true"]{color:var(--text);font-weight:600}
.tw-chip[aria-checked="true"] .tw-dot{outline:2px solid var(--text);outline-offset:3px}
.tw-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tw-tiles.tw-two{grid-template-columns:1fr 1fr}
.tw-tile{border:0;padding:0 0 8px;border-radius:10px;background:var(--raised);display:grid;gap:7px;color:var(--muted);font-size:12px;line-height:16px;cursor:pointer;overflow:hidden;transition:color .15s}
.tw-tile:hover{color:var(--text)}
.tw-tile img{width:100%;height:auto;display:block;aspect-ratio:150/64;object-fit:cover;background:var(--rule)}
.tw-tiles:not(.tw-two) .tw-tile img{aspect-ratio:100/64}
.tw-tile[aria-checked="true"]{color:var(--text);font-weight:600;outline:2px solid var(--text);outline-offset:2px}
.tw-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;border-radius:999px;background:var(--raised)}
.tw-seg-btn{height:36px;border:0;border-radius:999px;background:transparent;color:var(--muted);font:500 14px/20px var(--ui);display:grid;place-items:center;cursor:pointer;transition:background-color .15s,color .15s}
.tw-seg-btn:hover{color:var(--text)}
.tw-seg-btn[aria-checked="true"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.tw-seg-btn .tw-i{width:20px;height:20px}
.tw-switch-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 0}
.tw-switch-row small{display:block;font-size:12px;line-height:16px;color:var(--faint)}
.tw-switch{appearance:none;flex:none;margin:0;width:44px;height:26px;border:0;padding:0;border-radius:999px;background:var(--control);position:relative;cursor:pointer;transition:background-color .2s}
.tw-switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .32s cubic-bezier(.34,1.4,.64,1)}
.tw-switch[aria-checked="true"]{background:var(--primary)}
.tw-switch[aria-checked="true"]::after{transform:translateX(18px)}
.tw-sheet-list{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.tw-sheet-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px;padding:6px 4px 6px 6px;border-radius:10px;transition:background-color .15s}
.tw-sheet-row:hover,.tw-sheet-row[aria-current="true"]{background:var(--raised)}
.tw-sheet-open{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:12px;min-width:0;padding:0;border:0;border-radius:6px;background:none;text-align:left;cursor:pointer}
.tw-sheet-open>span{min-width:0}
.tw-thumb{width:44px;height:57px;border-radius:2px;display:block;box-shadow:0 0 0 1px rgba(35,33,30,.1);background:#ECE7DB}
.tw-sheet-name{display:block;font-size:14px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw-sheet-sub{display:block;font-size:12px;line-height:16px;color:var(--faint);font-variant-numeric:tabular-nums}
.tw-trash{width:36px;height:36px;border:0;border-radius:999px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.tw-trash .tw-i{width:18px;height:18px}
.tw-trash:hover{color:var(--alarm);background:rgba(178,58,44,.08)}
.tw-row-btn{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;margin-top:14px;border:1px solid var(--rule);border-radius:10px;background:transparent;color:var(--text);text-align:left;cursor:pointer;transition:background-color .15s}
.tw-row-btn:hover{background:var(--raised)}
.tw-row-btn>span{flex:1}
.tw-row-btn small{display:block;font-size:12px;line-height:16px;color:var(--faint)}
.tw-danger{color:var(--alarm)}
.tw-danger[data-armed="true"]{background:var(--alarm);border-color:var(--alarm);color:#fff}
.tw-danger[data-armed="true"] small{color:rgba(255,255,255,.86)}
.tw-field{width:100%;height:44px;padding:0 14px;border:1px solid var(--rule);border-radius:10px;background:#FBFAF8;color:var(--text);font:15px/20px var(--ui);outline:none;user-select:text;-webkit-user-select:text}
.tw-field:focus-visible{border-color:var(--gold);box-shadow:0 0 0 3px rgba(160,106,28,.18)}
.tw-options{display:grid;gap:8px}
.tw-option{display:grid;grid-template-columns:22px 1fr;gap:2px 12px;align-items:center;text-align:left;padding:13px 16px;border-radius:10px;border:1px solid var(--control);background:transparent;color:var(--text);cursor:pointer;transition:background-color .15s,transform .14s var(--ease-out)}
.tw-option:hover{background:var(--raised)}
.tw-option:active{transform:scale(.985)}
.tw-option b{font-size:14px;line-height:20px;font-weight:600}
.tw-option small{grid-column:2;font-size:12px;line-height:16px;color:var(--faint)}
.tw-option.tw-primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.tw-option.tw-primary:hover{background:var(--primary-hover)}
.tw-option.tw-primary small{color:var(--on-primary-muted)}
.tw-option:disabled{opacity:.45;cursor:default;transform:none}
.tw-toast{position:absolute;left:50%;top:66px;z-index:12;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);min-height:40px;padding:8px 18px;border-radius:999px;background:var(--primary);color:var(--on-primary);font-size:14px;line-height:20px;box-shadow:0 10px 28px rgba(0,0,0,.3);transform:translateX(-50%);animation:tw-toast .42s cubic-bezier(.34,1.3,.64,1)}
.tw-toast:has(button){padding-right:6px}
.tw-toast button{border:0;border-radius:999px;background:var(--on-primary);color:var(--primary);padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer}
@keyframes tw-toast{from{opacity:0;transform:translate(-50%,-10px) scale(.98)}}
/* Send as a letter: the sheet leaves the machine, folds, and is sealed in an envelope */
.tw-send{position:absolute;inset:0;z-index:20;pointer-events:none;--e:cubic-bezier(.2,.9,.25,1)}
.tw-send-group{position:absolute;inset:0;transform-origin:var(--ox) var(--oy);transition:transform .56s cubic-bezier(.55,0,.75,.2),opacity .5s .06s}
.tw-send[data-phase="away"] .tw-send-group{transform:translate(var(--ax),var(--ay)) scale(.06) rotate(-8deg);opacity:0}
.tw-send-slot{position:absolute;left:0;right:0;top:0;height:var(--tear);overflow:hidden;z-index:2}
.tw-send:not([data-phase="start"]):not([data-phase="pull"]) .tw-send-slot{height:100%;overflow:visible}
.tw-send-sheet{position:absolute;left:var(--x);top:var(--y);width:var(--w);height:var(--h);perspective:calc(var(--h) * 1.25);transform-style:preserve-3d;transition:transform .54s var(--e)}
.tw-send[data-phase="pull"] .tw-send-sheet{transform:translateY(var(--pull));transition:transform .54s cubic-bezier(.5,0,.2,1)}
.tw-send[data-phase="float"] .tw-send-sheet,.tw-send[data-phase^="fold"] .tw-send-sheet{transform:translate(var(--fx),var(--fy)) scale(var(--fit))}
.tw-send[data-phase="env"] .tw-send-sheet{transform:translate(var(--fx),var(--hy)) scale(var(--fit2))}
.tw-send[data-phase="insert"] .tw-send-sheet,.tw-send[data-phase="close"] .tw-send-sheet,.tw-send[data-phase="away"] .tw-send-sheet{transform:translate(var(--fx),var(--iy)) scale(var(--fit2))}
.tw-send-p{position:absolute;left:0;width:100%;height:33.334%;transform-style:preserve-3d;transition:transform .44s var(--e)}
.tw-send-p1{top:0;transform-origin:50% 100%}
.tw-send-p2{top:33.333%}
.tw-send-p3{top:66.666%;transform-origin:50% 0}
.tw-send-p i,.tw-send-p b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.tw-send-p i{background:var(--paper) var(--img) no-repeat;background-size:100% 300%}
.tw-send-p1 i{background-position:0 0}
.tw-send-p2 i{background-position:0 50%}
.tw-send-p3 i{background-position:0 100%;clip-path:polygon(0 0,100% 0,100% 97%,92% 98.6%,84% 97.4%,75% 99%,66% 97.6%,57% 98.8%,49% 97.2%,40% 98.9%,31% 97.5%,22% 98.7%,13% 97.3%,6% 98.5%,0 97.6%)}
.tw-send-p b{transform:rotateX(180deg);background:var(--paper) var(--back) no-repeat;background-size:100% 300%}
.tw-send-p1 b{background-position:0 0}
.tw-send-p2 b{background-position:0 50%}
.tw-send-p3 b{background-position:0 100%}
.tw-send:not([data-phase="start"]):not([data-phase="pull"]):not([data-phase="float"]) .tw-send-p3{transform:translateZ(.8px) rotateX(180deg)}
.tw-send[data-phase="fold1"] .tw-send-p1,.tw-send[data-phase="env"] .tw-send-p1,.tw-send[data-phase="insert"] .tw-send-p1,.tw-send[data-phase="close"] .tw-send-p1,.tw-send[data-phase="away"] .tw-send-p1{transform:translateZ(1.6px) rotateX(-178deg)}
.tw-send-env{position:absolute;left:var(--ex);top:var(--ey);width:var(--ew);height:var(--eh);transform:translateY(calc(100cqh - var(--ey) + 40px));transition:transform .52s var(--e)}
.tw-send-env svg{display:block;width:100%;height:100%;overflow:visible}
.tw-send-in{z-index:1;border-radius:4px;box-shadow:0 18px 40px -14px rgba(40,30,15,.4),0 3px 8px rgba(40,30,15,.16)}
.tw-send-flap .in{opacity:0}
.tw-send-flap .in,.tw-send-flap .out{transition:opacity 0s .08s}
.tw-send[data-phase="env"] .tw-send-flap .in,.tw-send[data-phase="insert"] .tw-send-flap .in{opacity:1;transition-delay:.1s}
.tw-send[data-phase="env"] .tw-send-flap .out,.tw-send[data-phase="insert"] .tw-send-flap .out{opacity:0;transition-delay:.1s}
.tw-send-pocket{z-index:3}
.tw-send-flap{z-index:1;transform-origin:50% 0}
.tw-send-seal{z-index:6;opacity:0}
.tw-send[data-phase="env"] .tw-send-env,.tw-send[data-phase="insert"] .tw-send-env,.tw-send[data-phase="close"] .tw-send-env,.tw-send[data-phase="away"] .tw-send-env{transform:none}
.tw-send[data-phase="env"] .tw-send-flap,.tw-send[data-phase="insert"] .tw-send-flap{transform:perspective(1600px) rotateX(-176deg)}
.tw-send[data-phase="close"] .tw-send-flap,.tw-send[data-phase="away"] .tw-send-flap{z-index:5;transform:perspective(1600px) rotateX(0deg);transition:transform .42s var(--e)}
.tw-send[data-phase="close"] .tw-send-seal,.tw-send[data-phase="away"] .tw-send-seal{transform:none;opacity:1;animation:tw-seal .36s .3s both cubic-bezier(.2,.9,.25,1)}
@keyframes tw-seal{from{transform:scale(1.35);opacity:0}}
@container (max-width:719px){
.tw-dock{bottom:12px;gap:0;padding:5px}
.tw-dock-btn{width:42px;height:42px}
.tw-rule{margin:0 3px}
.tw-edit{bottom:12px}
.tw-panel,.tw-panel.tw-wide,.tw-panel[data-at]{left:0;right:0;top:auto;bottom:0;width:auto;margin:0;max-height:88%;border-width:1px 0 0;border-radius:18px 18px 0 0;box-shadow:0 -10px 32px rgba(0,0,0,.22);animation:tw-sheet .44s var(--ease-out)}
.tw-grabber{display:block;width:36px;height:5px;border-radius:3px;background:var(--control);margin:8px auto 0;flex:none}
.tw-panel header{padding-top:6px}
.tw:not([data-panel="none"]) .tw-scrim{opacity:.38}
}

<sc-if value="{{sheetsOpen}}" hint-placeholder-val="{{false}}">
<section class="tw-panel tw-wide" data-at="top-left" role="dialog" aria-labelledby="tw-sheets-title">
<div class="tw-grabber" aria-hidden="true"></div>
<header>
<div class="tw-masthead">
<svg viewBox="0 0 64 64" aria-hidden="true"><defs><radialGradient id="tw-pp" cx=".5" cy=".42" r=".75"><stop offset="0" stop-color="#F7EFDD"></stop><stop offset=".6" stop-color="#EFE3C8"></stop><stop offset="1" stop-color="#D8C49E"></stop></radialGradient><linearGradient id="tw-pk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B2723"></stop><stop offset="1" stop-color="#0D0B09"></stop></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#tw-pp)"></rect><g transform="translate(12 12) scale(.0892857)" fill="url(#tw-pk)"><path d="M0 0A112 112 0 0 1 112 112L112 224A112 112 0 0 1 0 112ZM112 0A112 112 0 0 1 224 112A112 112 0 0 1 336 0L336 112A112 112 0 0 1 224 224A112 112 0 0 1 112 112ZM448 0A112 112 0 0 0 336 112L336 224A112 112 0 0 0 448 112Z"></path><path d="M0 448A112 112 0 0 0 112 336L112 224A112 112 0 0 0 0 336ZM112 448A112 112 0 0 0 224 336A112 112 0 0 0 336 448L336 336A112 112 0 0 0 224 224A112 112 0 0 0 112 336ZM448 448A112 112 0 0 1 336 336L336 224A112 112 0 0 1 448 336Z"></path></g></svg>
<h2 id="tw-sheets-title"><span class="tw-wordmark">TypeWrite</span><span class="tw-by">by Jericho</span></h2>
</div>
<button class="tw-text-btn" type="button" onClick="{{closePanel}}">Done</button>
</header>
<div class="tw-body">
<p class="tw-label">Your sheets</p>
<ul class="tw-sheet-list">
<sc-for list="{{sheetsList}}" as="s" hint-placeholder-count="2">
<li class="tw-sheet-row" aria-current="{{s.current}}">
<button class="tw-sheet-open" type="button" onClick="{{s.open}}"><img class="tw-thumb" src="{{s.thumb}}" alt=""><span><span class="tw-sheet-name">{{s.name}}</span><span class="tw-sheet-sub">{{s.sub}}</span></span></button>
<sc-if value="{{s.canThrow}}" hint-placeholder-val="{{false}}">
<button class="tw-trash" type="button" aria-label="{{s.throwLabel}}" title="Throw away" onClick="{{s.throwAway}}"><svg class="tw-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
</sc-if>
</li>
</sc-for>
</ul>
<p class="tw-note">Sheets are kept in this browser only. Download any you want to keep.</p>
<p class="tw-note">Typewriter sounds: Erik Pålsson, Sounds of Changes (CC BY 4.0), with CC0 recordings by knufds and others. The meadow: birds by Thimras (CC0); crickets by dklon (CC BY 3.0); the paper tear by OwlishMedia (CC0), all from OpenGameArt.</p>
<div class="tw-group">
<p class="tw-label">Machine</p>
<div class="tw-switch-row"><span>Key sounds</span><button class="tw-switch" type="button" role="switch" aria-checked="{{soundOn}}" aria-label="Key sounds" onClick="{{toggleSound}}"></button></div>
<div class="tw-switch-row"><span>Nature sounds<small>Birdsong by day, crickets when the lamp is on</small></span><button class="tw-switch" type="button" role="switch" aria-checked="{{natureOn}}" aria-label="Nature sounds" onClick="{{toggleNature}}"></button></div>
<div class="tw-switch-row"><span>Key taps<small>On phones that can vibrate</small></span><button class="tw-switch" type="button" role="switch" aria-checked="{{buzzOn}}" aria-label="Key taps" onClick="{{toggleBuzz}}"></button></div>
<div class="tw-switch-row"><span>Desk lamp<small>Moonlight outside, a warm lamp on the page</small></span><button class="tw-switch" type="button" role="switch" aria-checked="{{lampOn}}" aria-label="Desk lamp" onClick="{{toggleLamp}}"></button></div>
</div>
<button class="tw-row-btn tw-danger" type="button" data-armed="{{armed}}" onClick="{{resetAll}}">
<svg class="tw-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"></path></svg>
<span><span>{{resetLabel}}</span><small>{{resetHint}}</small></span>
</button>
</div>
</section>
</sc-if>

<sc-if value="{{saveOpen}}" hint-placeholder-val="{{false}}">
<section class="tw-panel" data-at="top-right" role="dialog" aria-labelledby="tw-save-title">
<div class="tw-grabber" aria-hidden="true"></div>
<header><h2 id="tw-save-title">Share</h2><button class="tw-text-btn" type="button" onClick="{{closePanel}}">Done</button></header>
<div class="tw-body">
<div class="tw-options">
<button class="tw-option tw-primary" type="button" disabled="{{saveBlank}}" onClick="{{shareLetter}}">
<svg class="tw-i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="1.5"></rect><path d="m3.5 6.5 8.5 7 8.5-7"></path></svg>
<b>Send as a letter</b><small>One HTML file that opens in any browser as a sealed envelope</small>
</button>
<div class="tw-switch-row"><span>Envelope opening<small>On, they slide across the flap to tear it open. Off, the letter opens flat.</small></span><button class="tw-switch" type="button" role="switch" aria-checked="{{letterOpens}}" aria-label="Envelope opening" onClick="{{toggleLetterOpens}}"></button></div>
<button class="tw-option" type="button" disabled="{{saveBlank}}" onClick="{{savePng}}">
<svg class="tw-i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
<b>Picture of the sheet</b><small>PNG of the whole page, up to three times size</small>
</button>
<button class="tw-option" type="button" disabled="{{saveBlank}}" onClick="{{saveTxt}}">
<svg class="tw-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 10h14M5 14h10M5 18h7"></path></svg>
<b>Just the words</b><small>Plain text with your own line breaks</small>
</button>
</div>
<p class="tw-note">{{saveNote}}</p>
</div>
</section>
</sc-if>

<sc-if value="{{paperOpen}}" hint-placeholder-val="{{false}}">
<section class="tw-panel" data-at="dock" role="dialog" aria-labelledby="tw-paper-title">
<div class="tw-grabber" aria-hidden="true"></div>
<header><h2 id="tw-paper-title">Paper</h2><button class="tw-text-btn" type="button" onClick="{{closePanel}}">Done</button></header>
<div class="tw-body">
<div class="tw-chips" role="radiogroup" aria-labelledby="tw-paper-title">

</sc-for>
</div>
<p class="tw-note">{{paperNote}}</p>
</div>
</section>
</sc-if>

<sc-if value="{{inkOpen}}" hint-placeholder-val="{{false}}">
<section class="tw-panel" data-at="dock" role="dialog" aria-labelledby="tw-ink-title">
<div class="tw-grabber" aria-hidden="true"></div>
<header><h2 id="tw-ink-title">Ribbon</h2><button class="tw-text-btn" type="button" onClick="{{closePanel}}">Done</button></header>
<div class="tw-body">
<div class="tw-chips" role="radiogroup" aria-labelledby="tw-ink-title">
<sc-for list="{{inks}}" as="p" hint-placeholder-count="6">
<button class="tw-chip" type="button" role="radio" aria-checked="{{p.on}}" tabindex="{{p.tab}}" onClick="{{p.choose}}"><img class="tw-dot" src="{{p.img}}" alt="">{{p.name}}</button>
</sc-for>
</div>
<p class="tw-note">{{inkNote}}</p>
</div>
</section>
</sc-if>

<sc-if value="{{faceOpen}}" hint-placeholder-val="{{false}}">
<section class="tw-panel" data-at="dock" role="dialog" aria-labelledby="tw-face-title">
<div class="tw-grabber" aria-hidden="true"></div>
<header><h2 id="tw-face-title">Typeface</h2><button class="tw-text-btn" type="button" onClick="{{closePanel}}">Done</button></header>
<div class="tw-body">
<div class="tw-tiles tw-two" role="radiogroup" aria-labelledby="tw-face-title">
<sc-for list="{{faces}}" as="p" hint-placeholder-count="4">
<button class="tw-tile" type="button" role="radio" aria-checked="{{p.on}}" tabindex="{{p.tab}}" onClick="{{p.choose}}"><img src="{{p.img}}" alt="">{{p.name}}</button>
</sc-for>
</div>
<div class="tw-group"><p class="tw-label" id="tw-size-label">Size</p>
<div class="tw-seg" role="radiogroup" aria-labelledby="tw-size-label">
<sc-for list="{{sizes}}" as="p" hint-placeholder-count="3"><button class="tw-seg-btn" type="button" role="radio" aria-checked="{{p.on}}" tabindex="{{p.tab}}" onClick="{{p.choose}}">{{p.name}}</button></sc-for>
</div></div>
<div class="tw-group"><p class="tw-label" id="tw-spacing-label">Line spacing</p>
<div class="tw-seg" role="radiogroup" aria-labelledby="tw-spacing-label">
<sc-for list="{{spacings}}" as="p" hint-placeholder-count="3"><button class="tw-seg-btn" type="button" role="radio" aria-checked="{{p.on}}" tabindex="{{p.tab}}" onClick="{{p.choose}}">{{p.name}}</button></sc-for>
</div></div>
<div class="tw-group"><p class="tw-label" id="tw-align-label">Align</p>
<div class="tw-seg" role="radiogroup" aria-labelledby="tw-align-label">
<sc-for list="{{aligns}}" as="p" hint-placeholder-count="3"><button class="tw-seg-btn" type="button" role="radio" aria-checked="{{p.on}}" tabindex="{{p.tab}}" aria-label="{{p.name}}" title="{{p.name}}" onClick="{{p.choose}}"><svg class="tw-i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{p.d}}"></path></svg></button></sc-for>
</div></div>
<p class="tw-note">Bigger type fits fewer letters on a line, like a wider pitch. The spacing is the machine's line-space lever.</p>
</div>
</section>
</sc-if>

<sc-if value="{{titleOpen}}" hint-placeholder-val="{{false}}">
<section class="tw-panel" data-at="dock" role="dialog" aria-labelledby="tw-title-title">
<div class="tw-grabber" aria-hidden="true"></div>
<header><h2 id="tw-title-title">Title</h2><button class="tw-text-btn" type="button" onClick="{{closePanel}}">Done</button></header>
<div class="tw-body">
<input class="tw-field" ref="{{setTitleField}}" type="text" maxlength="48" placeholder="A title for this sheet" autocomplete="off" aria-labelledby="tw-title-title" value="{{titleValue}}" onChange="{{onTitle}}" onKeyDown="{{titleKey}}">
<p class="tw-note">Typed at the top of the sheet, centred and a size up. It also names the sheet and its downloads.</p>

</section>
</sc-if>

<sc-if value="{{flowerOpen}}" hint-placeholder-val="{{false}}">

<div class="tw-tiles" role="radiogroup" aria-labelledby="tw-flower-title">
<sc-for list="{{flowers}}" as="p" hint-placeholder-count="6">
<button class="tw-tile" type="button" role="radio" aria-checked="{{p.on}}" tabindex="{{p.tab}}" aria-label="{{p.name}}" onClick="{{p.choose}}"><img src="{{p.img}}" alt="">{{p.name}}</button>
</sc-for>
</div>
<p class="tw-note">Pressed into the top corner of the sheet, its dyes soaked into the paper.</p>
</div>
</section>
</sc-if>

<sc-if value="{{toastOn}}" hint-placeholder-val="{{false}}">
<div class="tw-toast" role="status" aria-live="polite"><span>{{toastText}}</span><sc-if value="{{toastHasAction}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{toastRun}}">{{toastLabel}}</button></sc-if></div>
</sc-if>
</div>

function useMetrics(s) {

  ADV = (PAPER_W - SIDE * 2) / COLS; TYPE_K = ADV / 10.2; LH = byId(SPACINGS, s.spacing).lh * TYPE_K; BELL_COL = COLS - 6;

function lineShift(line) {

const MASK = (1n << 64n) - 1n, GOLDEN = 0x9E3779B97F4A7C15n;

  gW = vec4(1.0 - ka, ka - kb, kb - kc, kc);

  // the sun swings along an arc, down and to the right, behind the far hills
  gSunDay = vec2(0.0, clamp(gHor - 0.10, 0.30, 0.40));
  gSet = pow(clamp(u * 2.0, 0.0, 1.0), 1.3);       // touches the hills around 0.35
  float ph = gSet * 1.5708;
  vec2 s1 = vec2(min(0.30, gHalfW * 0.6), gHor + 0.05);
  gSun = vec2(s1.x * sin(ph), gSunDay.y + (s1.y - gSunDay.y) * (1.0 - cos(ph)));
  gSunVis = 1.0 - smoothstep(0.42, 0.56, u);
  // the moon rises on the opposite side
  float mr = smoothstep(0.42, 1.0, u);
  float pm = mr * 1.5708;
  vec2 m0 = vec2(-min(0.34, gHalfW * 0.62), gHor + 0.06);
  vec2 m1 = vec2(-min(0.22, gHalfW * 0.25), mix(0.29, 0.22, smoothstep(0.2, 0.9, gHalfW)));
  gMoon = vec2(m0.x + (m1.x - m0.x) * (1.0 - cos(pm)), m0.y + (m1.y - m0.y) * sin(pm));
  gMoonVis = smoothstep(0.45, 0.75, u);
  gNight = smoothstep(0.55, 0.95, u);
  gLightMix = smoothstep(0.52, 0.72, u);            // cloud key light: sun -> moon
  gLightUp = todf(vec4(-0.8, 0.15, 0.0, -0.5));     // sunset light comes from below

  //                day                      sunset                  dusk                    night
  gZen    = tod(C_ZENITH,               vec3(0.46, 0.50, 0.70), vec3(0.20, 0.21, 0.41), vec3(0.118, 0.133, 0.275));
  gMidSky = tod(C_CREAM,                vec3(0.90, 0.66, 0.64), vec3(0.40, 0.31, 0.50), vec3(0.17, 0.17, 0.34));
  gHorSky = tod(C_PEACH,                vec3(0.99, 0.62, 0.38), vec3(0.66, 0.40, 0.47), vec3(0.227, 0.208, 0.40));
  gGlowC  = tod(vec3(0.99, 0.80, 0.52), vec3(1.0, 0.52, 0.24),  vec3(0.92, 0.42, 0.30), vec3(0.50, 0.40, 0.48));
  gCoreC  = tod(C_SUN,                  vec3(1.0, 0.84, 0.56),  vec3(1.0, 0.70, 0.45),  vec3(1.0, 0.70, 0.45));
  gTwiC   = tod(C_PEACH,                vec3(1.0, 0.50, 0.26),  vec3(0.88, 0.40, 0.32), vec3(0.36, 0.26, 0.42));
  gGlowAmt  = todf(vec4(0.70, 0.62, 0.40, 0.0));
  gTwiAmt   = todf(vec4(0.0, 0.62, 0.75, 0.20));
  gBloomAmt = todf(vec4(0.20, 0.22, 0.10, 0.0));
  gCoreAmt  = todf(vec4(0.45, 0.40, 0.0, 0.0));

  gCSh  = tod(vec3(0.71, 0.72, 0.84), vec3(0.62, 0.54, 0.68), vec3(0.34, 0.30, 0.48), vec3(0.13, 0.15, 0.25));
  gCMid = tod(vec3(0.95, 0.89, 0.83), vec3(0.95, 0.68, 0.62), vec3(0.56, 0.42, 0.56), vec3(0.20, 0.23, 0.34));
  gCLit = tod(vec3(1.0, 0.95, 0.81),  vec3(1.0, 0.83, 0.58),  vec3(0.90, 0.60, 0.56), vec3(0.38, 0.44, 0.58));
  gCloudK = todf(vec4(1.0, 1.0, 0.85, 0.5));
  gRimW   = todf(vec4(0.03, 0.03, 0.022, 0.012));
  gRim  = tod(vec3(1.0, 0.95, 0.80),  vec3(1.0, 0.76, 0.40),  vec3(1.0, 0.66, 0.52), vec3(0.78, 0.85, 1.0));
  gRimAmt   = todf(vec4(0.55, 0.80, 0.55, 0.75));
  gNearWarm = todf(vec4(0.8, 1.0, 0.6, 0.0));

  gFarG  = vec3(0.84, 0.58, 0.54) * gW.y + vec3(0.42, 0.33, 0.48) * gW.z + vec3(0.19, 0.23, 0.33) * gW.w;
  gNearG = vec3(0.24, 0.18, 0.24) * gW.y + vec3(0.13, 0.13, 0.19) * gW.z + vec3(0.065, 0.11, 0.125) * gW.w;
  gChroma = todf(vec4(0.0, 0.40, 0.18, 0.14));
}

// re-light a day colour for sunset / dusk / night. d: 0 far .. 1 near
vec3 grade(vec3 c, float d) {
  float L = dot(c, vec3(0.30, 0.55, 0.15));
  vec3 g = mix(gFarG, gNearG, d) * (0.62 + 0.9 * (L - 0.55));
  return c * gW.x + g + (c - L) * gChroma;
}

// ------------------------------------------------------------------- clouds --
// a cloud mass blob in edge-relative coords e = (distance from side edge, y).
// returns (mass, base y)
vec2 gMassQ;   // position inside the winning blob, set by cloudMass
vec2 blob(vec2 e, vec2 ctr, vec2 rad, float base, inout vec2 best) {
  vec2 q = (e - ctr) / rad;
  float m = min(1.0 - length(q), (base - e.y) * 6.0);
  if (m > best.x) { best = vec2(m, base); gMassQ = q; }
  return best;
}

// where cumulus billows may live (x > 0 inside), and the local cloud base
vec2 cloudMass(vec2 c) {
  float ex = gHalfW - abs(c.x);
  vec2 e = vec2(ex, c.y);
  vec2 m = vec2(-1e3, 0.0);
  float wv = smoothstep(0.2, 0.9, gHalfW);
  if (c.x < 0.0) {
    blob(e, vec2(0.0 + 0.10 * wv, 0.19), vec2(0.15 + 0.22 * wv, 0.20), 0.34, m);
    blob(e, vec2(0.18 + 0.2 * wv, gHor - 0.07), vec2(0.16 + 0.12 * wv, 0.065), gHor - 0.03, m);
  } else {
    blob(e, vec2(0.01 + 0.11 * wv, 0.14), vec2(0.14 + 0.20 * wv, 0.16), 0.27, m);
    blob(e, vec2(0.06 + 0.08 * wv, gHor - 0.09), vec2(0.18 + 0.16 * wv, 0.07), gHor - 0.04, m);
    gMassQ.x = -gMassQ.x;                      // edge-relative x runs leftward on the right
  }
  // keep a window around the (day) sun
  float ds = length((c - gSunDay) * vec2(1.0, 1.3));
  m.x = min(m.x, (ds - 0.15) * 4.0);
  m.x += sin(c.x * 11.0 + sin(c.y * 9.0) * 1.7) * sin(c.y * 14.0 + c.x * 6.0 + 1.0) * 0.17;
  return m;
}
// conservative test: could any billow reach p?
bool nearCloud(vec2 p) {
  const float G = 0.10;   // billow reach + warp + soft edge
  float ex = gHalfW - abs(p.x);
  vec2 e = vec2(ex, p.y);
  float wv = smoothstep(0.2, 0.9, gHalfW);
  float d;
  if (p.x < 0.0) {
    d = min(length((e - vec2(0.10 * wv, 0.19)) / vec2(0.15 + 0.22 * wv + G, 0.20 + G)),
            length((e - vec2(0.18 + 0.2 * wv, gHor - 0.07)) / vec2(0.16 + 0.12 * wv + G, 0.065 + G)));
  } else {
    d = min(length((e - vec2(0.01 + 0.11 * wv, 0.14)) / vec2(0.14 + 0.20 * wv + G, 0.16 + G)),
            length((e - vec2(0.06 + 0.08 * wv, gHor - 0.09)) / vec2(0.18 + 0.16 * wv + G, 0.07 + G)));
  }
  return d < 1.0;
}

float smax(float a, float b, float k) {
  float h = max(k - abs(a - b), 0.0) / k;
  return max(a, b) + h * h * k * 0.25;
}

// Silhouette of the billow union, as a soft coverage (> 0 inside, roughly a distance),
// plus the billow nearest the surface here (centre, radius) for curved brush strokes.
// The billows only shape the outline; they are never shaded on their own.
void cloudCover(vec2 p, vec2 Ld, float cs, float seed, float mmin, vec3 M, float base,
                inout float cov, inout vec2 head) {
  vec2 id = floor(p / cs);
  float reach = 0.9 * cs + 0.02;
  float reach2 = reach * reach;
  for (int j = -1; j <= 1; j++) {
    for (int i = -1; i <= 1; i++) {
      vec2 cid = id + vec2(float(i), float(j));
      vec3 h = h32(cid + seed);
      vec2 c = (cid + 0.2 + 0.6 * h.xy) * cs;
      vec2 dc = p - c;
      if (dot(dc, dc) > reach2) continue;
      float m = M.x + dot(M.yz, c - p);       // mass from the local linear model
      if (m <= mmin) continue;
      float r = cs * (0.62 + 0.28 * h.z) * (0.4 + 0.6 * smoothstep(0.0, 0.4, m))
              * smoothstep(mmin, mmin + 0.12, m);
      // distant clouds near the horizon are flatter
      vec2 S = vec2(1.0, 1.0 + 0.45 * smoothstep(gHor - 0.16, gHor - 0.05, c.y));
      float e = min(r - length(dc * S), base + 0.012 - p.y);
      if (r < 0.004) continue;
      cov = smax(cov, e, 0.025);              // soft union: no creases between billows
      // the billow whose rim is closest to the outer surface, upper ones first
      float k = e / r - 0.6 * (c.y - p.y) / r;
      // a soft, blended "which way do the billows here face" field (no per-billow edges)
      float wt = smoothstep(-0.01, 0.035, e) * r;
      head += vec2(wt * clamp(dot(dc, Ld) / r, -1.0, 1.0), wt);
    }
  }
}

vec4 clouds(vec2 p) {
  if (!nearCloud(p)) return vec4(0.0);
  // airy, broken silhouette: warp the lookup a little
  vec2 w = vec2(vn(p * 14.0), vn(p * 40.0 + 7.7)) - 0.5;
  w = vec2(w.x + w.y * 0.45, w.y - w.x * 0.6);
  vec2 pw = p + w * 0.017;

  // key light: the sun (from below at sunset), then the moon
  vec2 toSun = gSun - p;
  float dSun = length(toSun);
  vec2 LdS = normalize(toSun / max(dSun, 1e-3) + vec2(0.0, gLightUp));
  vec2 toMoon = gMoon - p;
  float dMoon = length(toMoon);
  vec2 LdM = normalize(toMoon / max(dMoon, 1e-3) + vec2(0.0, -0.5));
  vec2 Ld = mix(LdS, LdM, gLightMix);
  Ld = Ld / max(length(Ld), 0.2);
  float sunNear = exp(-dSun * 3.0) * gNearWarm;
  float moonNear = exp(-dMoon * 3.5) * gMoonVis;
  float glowNear = max(sunNear, moonNear);

  // local linear model of the mass field (3 evaluations instead of one per billow)
  float mx = cloudMass(pw + vec2(0.02, 0.0)).x;
  float my = cloudMass(pw + vec2(0.0, 0.02)).x;
  vec2 m0 = cloudMass(pw);                         // last, so gMassQ belongs to pw
  vec2 Q = gMassQ;
  vec3 M = vec3(m0.x, (mx - m0.x) / 0.02, (my - m0.x) / 0.02);
  float base = m0.y;
  float cov = -1.0;
  vec2 head = vec2(0.0, 1e-4);
  cloudCover(pw, Ld, 0.075, 0.0, 0.0, M, base, cov, head);
  cloudCover(pw, Ld, 0.036, 13.0, 0.10, M, base, cov, head);
  float hf = head.x / head.y;
  // 1 near the outer silhouette, 0 deep inside the mass: small gaps between billows
  // inside a cloud are filled in and never get edge treatment
  float outer = smoothstep(0.45, 0.18, M.x);
  cov = max(cov, 0.03 - 0.12 * outer);

  // brush marks used for the edges and the paint texture
  float st  = brush(p, vec2(0.80, -0.60), 0.045, 0.014);
  // dry-brush breakup along diagonal strokes (rotated so the noise lattice never shows)
  vec2 dq = mat2(0.8, -0.6, 0.6, 0.8) * p;
  float dry = vn(vec2(dq.x * 38.0, dq.y * 120.0) + 2.3) * 0.6 + vn(dq * 70.0 + 5.1) * 0.4;
  float edge = cov + (dry - 0.5) * 0.010 + (st - 0.5) * 0.006;
  if (edge < -0.03) return vec4(0.0);

  // ONE smooth light gradient across the whole mass: sunlit side toward the light,
  // cool shade on the far, lower side
  float L = 0.50 + (0.45 + 0.12 * gW.x) * dot(Q, Ld) - 0.22 * Q.y * (1.0 - gW.y)
          - 0.22 * smoothstep(base - 0.10, base + 0.01, p.y) * (1.0 - gW.y);
  // the billow heads that face the light are painted a touch lighter, softly
  L += (0.20 + 0.08 * gW.x) * smoothstep(0.0, 0.8, hf) - 0.06 * smoothstep(0.0, -0.8, hf);
  // broad, soft-edged patches of lighter and darker paint, blocked in with a wet brush
  float pt = vn(p * 7.0 + 4.1) * 0.7 + vn(p * 16.0 + 1.7) * 0.3;
  L += (bands(pt, st, 3.0, 0.4) - 0.5) * 0.13;
  // curved, elongated strokes that run along the cloud's outline (the noise is narrow
  // across the edge-distance contours and long along them), in a band inside the edge
  float sk = 1.0 - 0.45 * gW.w - 0.5 * gW.z - 0.3 * gW.y;   // calmer when the light is coloured
  float ctr = vn(vec2(cov * 150.0 + 3.0, p.x * 13.0 + p.y * 8.0));
  float band = smoothstep(-0.004, 0.008, cov) * (1.0 - smoothstep(0.03, 0.075, cov)) * outer;
  float facing = 0.5 + 0.5 * dot(Q, Ld) + 0.5 * hf;
  L += smoothstep(0.55, 0.85, ctr) * band * (0.06 + 0.20 * smoothstep(0.5, 1.0, facing)) * sk;
  L -= smoothstep(0.6, 0.9, 1.0 - ctr) * band * 0.06 * smoothstep(0.5, 0.1, facing) * sk;
  L = clamp(L, 0.0, 1.0);

  vec3 shadowC = mix(gCSh, gCSh * vec3(0.95, 0.99, 1.05), smoothstep(0.25, 0.05, p.y) * 0.6);
  vec3 midC = mix(gCMid, gCMid * vec3(1.04, 1.0, 0.92), sunNear);
  vec3 litC = mix(gCLit, gCLit * vec3(1.0, 0.95, 0.82), sunNear * 0.7);
  vec3 col = L < 0.5 ? mix(shadowC, midC, smoothstep(0.0, 0.5, L))
                     : mix(midC, litC, smoothstep(0.5, 0.95, L));
  // slight paint-texture colour drift
  col += (vn(p * 52.0 + 9.0) - 0.5) * vec3(0.022, 0.008, -0.018);
  col *= 1.0 + (st - 0.5) * 0.03;

  // luminous edge where the cloud faces the light: a soft glow, feathered outward
  float lightSide = smoothstep(0.55, 0.95, 0.5 + 0.5 * dot(Q, Ld));
  float rim = (1.0 - smoothstep(-0.004, 0.03, cov)) * lightSide * outer;
  col = mix(col, gRim, rim * gRimAmt * (0.35 + 0.65 * glowNear));
  // distant clouds take on the colour of the haze
  float far = smoothstep(gHor - 0.17, gHor - 0.05, p.y);
  col = mix(col, mix(gMidSky, gHorSky, 0.45), far * 0.45);

  // feathered, dry-brushed edges; thin parts stay translucent
  float soft = mix(0.0045, 0.009, lightSide) + 0.009 * smoothstep(base - 0.06, base, p.y);
  float a = smoothstep(-soft, soft, edge);
  a *= mix(1.0, 0.6 + 0.4 * smoothstep(0.25, 0.75, dry), 1.0 - smoothstep(0.0, 0.025, cov));
  a *= 0.93 + 0.07 * smoothstep(0.0, 0.04, cov);
  a *= 1.0 - 0.3 * exp(-dSun * 3.0) * gSunVis * (1.0 - smoothstep(0.0, 0.03, cov));
  // a few wisps trailing off the edges
  float wisp = smoothstep(0.70, 0.93, brush(p + 4.3, vec2(0.99, 0.12), 0.055, 0.008));
  float aw = wisp * smoothstep(-0.045, -0.006, cov) * (1.0 - smoothstep(-0.006, 0.004, cov)) * 0.4 * (1.0 - a);
  // and a faint glow just outside the light-facing edge
  float ah = smoothstep(-0.035, 0.0, cov) * (1.0 - smoothstep(-0.004, 0.006, cov)) * lightSide
           * glowNear * 0.30 * gRimAmt * (1.0 - a - aw);
  float at = a + aw + ah;
  if (at <= 0.0) return vec4(0.0);
  col = (col * a + mix(midC, litC, 0.6) * aw + gRim * ah) / at;
  return vec4(col, clamp(at, 0.0, 1.0));
}

// ---------------------------------------------------------------------- sky --
vec3 sky(vec2 p) {
  // broad gouache strokes (constant directions: a position-dependent rotation would swirl)
  float n1 = brush(p, vec2(0.995, 0.0998), 0.11, 0.024);
  float n2 = brush(p + vec2(0.0, 0.37), vec2(0.990, -0.141), 0.05, 0.011);
  float t = clamp(p.y / gHor, 0.0, 1.0);
  float tb = mix(t, bands(t, n1, 8.0, 0.25), 0.55);
  vec3 c = mix(gZen, gMidSky, smoothstep(0.0, 0.72, tb));
  c = mix(c, gHorSky, smoothstep(0.6, 1.05, tb) * 0.6);

  // twilight band hugging the horizon around the setting point
  float tw = exp(-max(gHor - p.y, 0.0) * 7.0) * exp(-abs(p.x - gSun.x) * 1.3);
  c = mix(c, gTwiC, clamp(tw * gTwiAmt, 0.0, 1.0));

  // the sun glow, painted as soft concentric tonal steps; it flattens as it sets
  vec2 d = p - gSun;
  float r = length(d * vec2(0.8 - 0.35 * gSet, 1.1 + 0.4 * gSet));
  float g = exp(-r * 2.6);
  float gb = mix(g, bands(g, n2, 7.0, 0.25), 0.55);
  c = mix(c, gGlowC, gb * gGlowAmt);
  float core = gSunVis;
  if (core > 0.0) {
    c = mix(c, mix(gCoreC, vec3(1.0, 0.93, 0.76), gW.x), smoothstep(0.3, 1.0, exp(-r * 4.5)) * 0.9 * core);
    c = mix(c, gCoreC, smoothstep(0.45, 1.0, exp(-r * 7.0)) * core);
    c = mix(c, mix(gCoreC, vec3(1.0), 0.6), smoothstep(0.045, 0.02, r) * core);
    // soft rays
    vec2 rd = d / max(length(d), 1e-4);
    float rays = smoothstep(0.45, 0.8, vn(rd * 3.6 + 5.0)) * exp(-r * 1.8) * smoothstep(0.03, 0.14, r);
    c = mix(c, mix(gCoreC, vec3(1.0, 0.96, 0.86), 0.5), rays * 0.30 * core * (1.0 - gSet * 0.5));
  }

  if (gNight > 0.0) {
    // painterly stars: soft dabs, denser toward the top
    float dens = mix(0.42, 0.04, smoothstep(0.0, gHor, p.y));
    for (int l = 0; l < 2; l++) {
      float cs = l == 0 ? 0.036 : 0.018;
      vec2 id = floor(p / cs);
      vec3 h = h32(id + 31.0 + float(l) * 17.0);
      if (h.z < dens * (l == 0 ? 0.8 : 0.45)) {
        vec2 ctr = (id + 0.3 + 0.4 * h.xy) * cs;
        vec2 dd = (p - ctr) * vec2(1.0, 0.75 + 0.5 * h.y);
        float sz = (l == 0 ? 0.0019 + 0.0034 * h.x * h.x * h.x : 0.0015);
        float dl = length(dd);
        float b = (0.35 + 0.65 * fract(h.x * 13.7 + h.y * 7.1)) * gNight * (l == 0 ? 1.0 : 0.6);
        float s = smoothstep(sz, sz * 0.2, dl + (vn(dd * 900.0) - 0.5) * sz * 0.5)
                + 0.3 * exp(-dl * dl / (sz * sz * 4.0));
        vec3 sc = fract(h.y * 9.3) < 0.3 ? vec3(1.0, 0.92, 0.78) : vec3(0.88, 0.92, 1.0);
        c = mix(c, sc, clamp(s * b, 0.0, 1.0));
      }
    }
  }
  if (gMoonVis > 0.0) {
    // a soft painted moon with a halo
    vec2 dm = p - gMoon;
    float rm = length(dm);
    c = mix(c, vec3(0.55, 0.60, 0.80), exp(-rm * 4.0) * 0.30 * gMoonVis);
    c = mix(c, vec3(0.78, 0.82, 0.95), exp(-rm * 16.0) * 0.45 * gMoonVis);
    const float MR = 0.03;
    float edge = smoothstep(MR, MR - 0.004, rm + (vn(dm * 220.0) - 0.5) * 0.003);
    float maria = bands(vn(dm * 55.0 + 3.0), vn(dm * 140.0), 3.0, 0.2);
    vec3 mc = mix(vec3(0.99, 0.97, 0.89), vec3(0.84, 0.86, 0.86), maria * 0.6);
    mc *= 1.0 - 0.12 * smoothstep(0.0, MR, length(dm + vec2(-0.01, -0.008)));
    c = mix(c, mc, edge * gMoonVis);
  }
  c *= 1.0 + (n2 - 0.5) * 0.035;
  c += (n1 - 0.5) * vec3(0.016, 0.004, -0.014);
  return c;
}

// --------------------------------------------------------------------- land --
// back-to-front "over" compositing with premultiplied alpha; w carries depth
void over(inout vec4 acc, inout float accD, vec3 c, float m, float d) {
  acc = vec4(c, 1.0) * m + acc * (1.0 - m);
  accD = d * m + accD * (1.0 - m);
}

float rise(float x) { return smoothstep(0.08, gHalfW + 0.1, abs(x)); }

// ridge line (y, measured downward) of a hill layer
// prm: (offset below horizon, amplitude, frequency, phase); ra: rise toward the edges
float ridge(float x, vec4 prm, float ra) {
  return gHor + prm.x - prm.y * fbm1(x * prm.z + prm.w) - ra * rise(x);
}

// painted tree clumps sitting on a ridge line. returns (colour, coverage)
vec4 clumps(vec2 p, float cs, float base, float sink, float dens, float haze, float seed) {
  base += sink;
  if (p.y > base + 0.008 || p.y < base - 2.0 * cs) return vec4(0.0);
  float tid = floor(p.x / cs);
  float leafy = vn(p * (9.0 / cs)) - 0.5;
  float best = 0.0, bdl = 2.0, bcx = 0.0, bid = 0.0;
  vec2 bdv = vec2(0.0);
  for (int k = -1; k <= 1; k++) {
    float cid = tid + float(k);
    float hh = h11(cid * 1.37 + seed);
    float cxx = (cid + 0.5 + (hh - 0.5) * 0.6) * cs;
    float pres = smoothstep(0.55, 0.85, vn1(cid * 0.21 + seed) + dens + 0.45 * rise(cxx));
    if (pres <= 0.0) continue;
    float r = cs * (0.65 + 0.55 * h11(cid * 2.13 + seed)) * (0.55 + 0.45 * pres);
    vec2 dv = (p - vec2(cxx, base - r * 0.55)) / r;
    dv.y *= 1.12;
    float dl = length(dv) + leafy * 0.28;
    float inside = smoothstep(1.03, 0.95, dl);
    if (inside > best) { best = inside; bdl = dl; bdv = dv; bcx = cxx; bid = cid; }
  }
  if (best <= 0.0) return vec4(0.0);
  best *= smoothstep(base + 0.006, base - 0.002, p.y);
  float sx = clamp((gSun.x - bcx) * 3.0, -0.8, 0.8);
  vec3 L = normalize(vec3(sx, -0.75, 0.45));
  float lit = clamp(dot(normalize(vec3(bdv, 0.55)), L) * 0.8 + 0.3, 0.0, 1.0);
  float leaf = vn(p * (16.0 / cs) + bid);
  float lb = mix(lit, bands(lit, leaf, 3.0, 0.14), 0.85);
  vec3 c = mix(vec3(0.29, 0.34, 0.25), vec3(0.50, 0.55, 0.34), smoothstep(0.1, 0.55, lb));
  c = mix(c, vec3(0.74, 0.72, 0.46), smoothstep(0.6, 0.95, lb));
  // warm rim on the sun side
  c = mix(c, vec3(0.86, 0.80, 0.55), smoothstep(0.82, 0.98, bdl) * step(0.0, sx * bdv.x - bdv.y * 0.3) * 0.6);
  c = mix(c, mix(C_FAR, C_CREAM, 0.35), haze);
  return vec4(c, best);
}

// returns colour (already re-lit for the time of day) and coverage
vec4 land(vec2 p) {
  float x = p.x;
  const vec4 PA = vec4(-0.006, 0.016, 6.0, 20.0);
  const vec4 PB = vec4(0.016, 0.024, 4.2, 11.0);
  const vec4 PM = vec4(0.056, 0.030, 2.8, 2.0);
  const vec4 PG = vec4(0.112, 0.018, 1.6, 4.0);
  float raM = x < 0.0 ? 0.090 : 0.075;
  float yA = ridge(x, PA, 0.022);
  if (p.y < yA - 0.07) return vec4(0.0);
  float yB = ridge(x, PB, 0.040);
  float yM = ridge(x, PM, raM);
  float yG = ridge(x, PG, 0.070);

  float sunPull = exp(-abs(x - gSunDay.x) * 2.5);
  vec3 haze = mix(C_CREAM, vec3(0.98, 0.90, 0.74), sunPull);
  float sb = brush(p, vec2(0.981, 0.196), 0.05, 0.007);
  float sb2 = brush(p, vec2(0.970, -0.243), 0.03, 0.005);
  float lsx = sign(gSun.x - x + 1e-4);

  vec4 acc = vec4(0.0);
  float accD = 0.0;
  if (p.y < yG + 0.004) {
  if (p.y < yM + 0.004) {
  // far range A: barely there
  over(acc, accD, mix(mix(C_FAR, haze, 0.55), vec3(0.74, 0.77, 0.76), 0.25),
       smoothstep(-0.0015, 0.0015, p.y - yA + (sb - 0.5) * 0.003), 0.0);

  // far range B: hazy sage, lit tops, fading into valley haze
  {
    float m = smoothstep(-0.0015, 0.0015, p.y - yB + (sb2 - 0.5) * 0.003);
    float lit = clamp(0.5 + (fbm1(x * 9.0 + 3.0) - 0.5) * 1.6, 0.0, 1.0);
    vec3 c = mix(C_FAR * 0.95, mix(C_FAR, C_CREAM, 0.45), bands(lit, sb, 3.0, 0.2));
    c = mix(c, haze, 0.25 + 0.3 * smoothstep(0.0, 0.03, p.y - yB));
    over(acc, accD, c, m, 0.22);
  }
  // small far trees on ridge B
  {
    vec4 t = clumps(p, 0.011, yB, 0.004, -0.05, 0.55, 7.0);
    over(acc, accD, t.rgb, t.a, 0.28);
  }
  }
  // mid hills: olive-sage with sunlit slopes and strokes along the slope
  if (p.y > yM - 0.003) {
    float m = smoothstep(-0.0015, 0.0015, p.y - yM + (sb - 0.5) * 0.003);
    float sl = (ridge(x + 0.010, PM, raM) - yM) / 0.010;
    float st = vn(vec2(x / 0.035, (p.y - yM) / 0.006));     // strokes parallel to the ridge
    float roll = vn(vec2(x * 7.0, (p.y - yM) * 14.0) + 3.0);
    float lit = clamp(0.45 + sl * lsx * 1.2 + (roll - 0.5) * 0.5, 0.0, 1.0);
    float lb = mix(lit, bands(lit, st, 3.0, 0.25), 0.6);
    vec3 c = mix(vec3(0.50, 0.56, 0.44), C_MID, smoothstep(0.0, 0.5, lb));
    c = mix(c, vec3(0.76, 0.75, 0.51), smoothstep(0.5, 1.0, lb));
    c = mix(c, vec3(0.88, 0.83, 0.62), smoothstep(0.010, 0.0, p.y - yM) * 0.55);   // lit ridge
    c = mix(c, haze, 0.18 + 0.45 * smoothstep(0.004, 0.06, p.y - yM));        // valley mist
    c *= 1.0 + (st - 0.5) * 0.06;
    over(acc, accD, c, m, 0.5);
  }
  // tree clumps on the mid hills
  {
    vec4 t = clumps(p, 0.017, yM, 0.010, -0.12, 0.30, 3.0);
    over(acc, accD, t.rgb, t.a, 0.58);
  }
  }
  // near tree clumps behind the meadow edge
  {
    vec4 t = clumps(p, 0.030, yG, 0.006, 0.0, 0.0, 1.0);
    over(acc, accD, t.rgb, t.a, 0.9);
  }

  // meadow
  float z = clamp((p.y - yG) / max(gRoll - yG, 0.02), 0.0, 1.0);
  if (p.y > yG - 0.003) {
    float gm = smoothstep(-0.0015, 0.0015, p.y - yG + (sb - 0.5) * 0.003);
    // perspective rows: row height and cell width both grow with distance below y0,
    // so cells stay roughly square on screen
    const float A = 0.16;
    float lv = log(max(p.y - (gHor - 0.02), 0.01)) / A;
    float lp = vn(vec2(x * 4.0, p.y * 13.0) + 5.0);
    vec3 gc = mix(vec3(0.88, 0.83, 0.58), C_MEADOW1, smoothstep(0.0, 0.35, z));
    gc = mix(gc, C_MEADOW2, smoothstep(0.4, 1.0, z) * 0.6);
    // grass flicks: short near-vertical strokes, one set per perspective row
    float rv = lv * 2.0;
    float ir = floor(rv);
    float fr = rv - ir;
    float uu = x / (A * exp((ir + 0.5) * 0.5 * A) * 0.5);
    float g1 = vn(vec2(uu * 4.0 + fr * 1.2 + ir * 7.1, fr * 0.7 + ir * 3.3));
    float g2 = vn(vec2(uu * 9.0 - fr * 0.8 + ir * 1.9, fr * 1.3 + ir * 5.7));
    float shade = bands(clamp(lp + (g1 - 0.5) * 0.3, 0.0, 1.0), g2, 3.0, 0.15);
    gc = mix(gc * vec3(0.84, 0.88, 0.80), gc, smoothstep(0.66, 0.42, shade));     // shadow patches
    gc = mix(gc, vec3(0.95, 0.86, 0.55), smoothstep(0.40, 0.16, shade) * 0.5);   // sun patches
    gc = mix(gc, vec3(0.95, 0.89, 0.66), sunPull * (1.0 - z) * 0.35);
    gc *= 0.90 + 0.16 * mix(g1, g2, 0.45);
    gc = mix(gc, vec3(0.90, 0.85, 0.62), smoothstep(0.012, 0.0, p.y - yG) * 0.35);
    float dM = 0.75 + 0.25 * z;
    over(acc, accD, gc, gm, dM);

    // flowers: dabs in perspective cells, gathered into drifts
    float drift = vn(vec2(x * 6.0, p.y * 11.0) + 11.0);
    float prob = smoothstep(0.40, 0.62, drift + z * 0.15) * 0.8 + 0.05;
    for (int l = 0; l < 2; l++) {
      float fl = float(l);
      float sc = 1.0 + fl * 0.8;
      float vv = lv * sc + fl * 0.61;
      float iv = floor(vv);
      float cw = A * exp((iv + 0.5 - fl * 0.61) / sc * A) / sc;  // cell width on screen
      float fu = x / cw + h11(iv + fl * 17.0) * 9.0;
      vec2 id = vec2(floor(fu), iv);
      vec2 f = vec2(fu, vv) - id;
      vec3 h = h32(id + 41.0 * fl);
      if (h.z > prob) continue;
      vec2 ctr = 0.3 + 0.4 * h.xy;
      float rr = 0.16 + 0.13 * h.y;
      vec2 dd = (f - ctr) * vec2(1.0, 1.25);
      float wob = (vn(f * 5.0 + id * 1.7) - 0.5) * 0.55;
      float fm = smoothstep(1.05, 0.85, length(dd) / rr + wob) * gm * smoothstep(0.0, 0.12, z);
      float sh = smoothstep(1.1, 0.6, length(dd - vec2(0.03, rr * 0.6)) / rr) * gm * 0.4;
      acc.rgb *= 1.0 - sh * (1.0 - fm) * vec3(0.30, 0.25, 0.42);
      float pick = fract(h.x * 7.31 + h.y * 3.17);
      vec3 fc = pick < 0.5 ? C_YELLOW : (pick < 0.8 ? C_ORANGE : C_WHITE);
      fc *= 0.85 + 0.2 * smoothstep(0.4, -0.5, dd.y / rr);
      fc = mix(fc, haze, (1.0 - z) * 0.3);
      over(acc, accD, fc, fm, dM);
    }
  }

  // morning mist lying on the meadow, thickest at the bottom
  float mb = brush(p, vec2(1.0, 0.0), 0.10, 0.012);
  float mist = smoothstep(gRoll - 0.065, gRoll - 0.002, p.y) * (0.72 + 0.38 * mb);
  mist = max(mist, exp(-pow((p.y - yG - 0.012) / 0.014, 2.0)) * 0.30 * smoothstep(-0.002, 0.002, p.y - yG) * (0.6 + 0.6 * mb));
  mist = clamp(mist, 0.0, 0.92);
  acc.rgb = mix(acc.rgb, C_MIST * acc.a, mist);

  vec3 col = acc.rgb / max(acc.a, 1e-4);
  float dep = accD / max(acc.a, 1e-4);
  col = grade(col, mix(dep, 0.45, mist * 0.6));

  if (gNight > 0.0 && p.y > yG) {
    // a few warm fireflies drifting over the meadow
    const float FC = 0.045;
    vec2 id = floor(p / FC);
    vec3 h = h32(id + 77.0);
    if (h.z < 0.13) {
      vec2 dd = p - (id + 0.3 + 0.4 * h.xy) * FC;
      float d2 = dot(dd, dd);
      float glow = exp(-d2 / 0.0000045) + 0.35 * exp(-d2 / 0.00003);
      col += vec3(1.0, 0.80, 0.40) * glow * gNight * (0.6 + 0.4 * h.x) * (1.0 - mist * 0.7);
    }
  }
  return vec4(col, acc.a);
}

// atmospheric bloom: sun (spreading along the horizon as it sets), then the moon
vec3 bloom(vec3 col, vec2 p) {
  vec2 d = p - gSun;
  float r = length(d * vec2(0.7 - 0.3 * gSet, 1.1 + 0.6 * gSet));
  col = mix(col, gGlowC, exp(-r * 2.2) * gBloomAmt);
  col = mix(col, gCoreC, exp(-r * 6.5) * gCoreAmt);
  if (gMoonVis > 0.0) col = mix(col, vec3(0.70, 0.76, 0.92), exp(-length(p - gMoon) * 9.0) * 0.18 * gMoonVis);
  return col;
}
// The high clouds are painted on their own layer so the live view can drift them; the low ones stay behind the hills.
float highCloud(vec2 p) { return smoothstep(gHor - 0.13, gHor - 0.22, p.y); }
vec3 paintSample(vec2 px, vec2 res) {
  vec2 p = vec2((px.x - 0.5 * res.x) / res.y, px.y / res.y);
  if (p.y > gRoll + 0.004) {
    // hidden under the typewriter roller: just let the mist continue, cheaply
    float mb = vn(vec2(p.x * 10.0, p.y * 80.0));
    return grade(mix(C_MIST, C_MEADOW1, 0.10 + 0.10 * mb), 0.5);
  }
  vec3 col = vec3(0.0);
  if (p.y < gHor + 0.002) {
    col = sky(p);
    if (p.y < gHor + 0.02) {
      vec4 c = clouds(p);
      col = mix(col, c.rgb, c.a * (1.0 - highCloud(p)));
    }
  }
  if (p.y > gHor - 0.12) {
    vec4 l = land(p);
    col = mix(col, l.rgb, l.a);
  }
  return clamp(bloom(col, p), 0.0, 1.0);
}

// paper / pigment grain, applied once per pixel after supersampling
vec3 paperGrain(vec3 col, vec2 px, vec2 res) {
  vec2 p = px / res.y;
  float gr = vn(p * 620.0) * 0.6 + vn(p * 210.0 + 5.0) * 0.4;
  return col * (0.976 + 0.04 * gr);
}

vec3 painting(vec2 px, vec2 res) {
  setupScene(res);
#if SSAA
  // 4x rotated-grid supersampling
  vec3 c = paintSample(px + vec2( 0.125,  0.375), res);
#if SSAA_ADAPTIVE
  // quads whose first sample is already smooth skip the other three
  // (needs painting() to be called in uniform control flow, as from main())
  vec3 dc = abs(dFdx(c)) + abs(dFdy(c));
  if (max(dc.r, max(dc.g, dc.b)) > SSAA_THRESHOLD) {
#endif
    c += paintSample(px + vec2(-0.375,  0.125), res);
    c += paintSample(px + vec2(-0.125, -0.375), res);
    c += paintSample(px + vec2( 0.375, -0.125), res);
    c *= 0.25;
#if SSAA_ADAPTIVE
  }
#endif
#else
  vec3 c = paintSample(px, res);
#endif
  return paperGrain(c, px, res);
}

// Layer 0: the painting without its high clouds. Layer 1: the high clouds alone, premultiplied, for the view to drift.
uniform float uLayer;
vec4 paintingLayer(vec2 px, vec2 res) {
  if (uLayer < 0.5) return vec4(painting(px, res), 1.0);
  setupScene(res);
  vec2 p = vec2((px.x - 0.5 * res.x) / res.y, px.y / res.y);
  float k = highCloud(p);
  if (k <= 0.0) return vec4(0.0);
  vec4 c = clouds(p);
  float a = c.a * k;
  return vec4(paperGrain(bloom(c.rgb, p), px, res) * a, a);
}

// The live view, every frame: the high clouds billow and drift like a slow fluid, wind ribbons stream across,
// pollen floats in the sun; at night stars twinkle and fireflies wander. Then the machine's enamel body.
const VIEW_FS = `

uniform vec2 uRes, uPar; uniform float uBodyY, uRollerY, uNight, uLamp, uTime, uPad;
varying vec2 vUv;

float fbm(vec2 p) { return 0.5 * vn(p) + 0.3 * vn(p * 2.03 + 3.1) + 0.2 * vn(p * 4.01 + 7.7); }

float segD(vec2 p, vec2 a, vec2 b) { vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h); }
