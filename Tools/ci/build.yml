# To switch on CI: move this file to .github/workflows/build.yml (GitHub only lets the repo owner add workflow files).
name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version

      - name: Engine tests
        run: swift test

      - name: Build the app for the iPhone Simulator
        run: |
          set -o pipefail
          xcodebuild -project TypeWrite.xcodeproj -scheme TypeWrite -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -n 60

      - name: Check the installer
        run: bash -n install.sh
